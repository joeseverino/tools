version: 2
updates:
  # The Node toolchain deps (doc-to-pdf's markdown-it, diagram's mermaid-cli,
  # the contract validators) pinned in the root package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # Types track the Node runtime (.nvmrc), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The CI workflow's actions (keeps the SHA-pinned uses: current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
