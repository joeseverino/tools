# The entire CI surface of this repo. Checkout, toolchain setup, pinned action
# SHAs, running the gate, and the report live once in cordon's reusable gate,
# which installs Node from .nvmrc plus this repo's npm deps and runs cordon's
# checks engine: ShellCheck, the bats suite, and cordon's invariants. The suite
# runs on macOS because the tools are macOS tools (BSD userland, zsh), so this
# sets the gate's `runner` and `packages`. Required status check: `cordon / gate`.
# See https://github.com/joeseverino/cordon/blob/main/docs/REUSABLE-GATE.md
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cordon:
    uses: joeseverino/cordon/.github/workflows/cordon-gate.yml@main
    with:
      runner: macos-latest
      packages: bash zsh bats-core jq
