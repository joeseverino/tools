[project]
name = "pdf-fill"
version = "0.1.0"
description = "Fill a PDF form — real AcroForm fields directly, or a flat/scanned form by label-anchored box detection."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.0",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
]

[project.scripts]
pdf-fill = "pdf_fill.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_fill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
